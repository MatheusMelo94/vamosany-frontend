name: Update snapshots

# Regenera o baseline de screenshots (oraculo do ADR-0006) no mesmo ambiente do CI
# e commita na branch. Rodar so quando uma mudanca visual foi aprovada por DDR, ou na
# primeira vez. Dois gatilhos: manual (Actions > Update snapshots) ou a label
# "update-snapshots" no PR (o workflow_dispatch so existe apos o merge na main).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots
        env:
          CI: "true"
      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots
          git diff --cached --quiet && { echo "baseline sem mudancas"; exit 0; }
          git commit -m "test(e2e): update screenshot baseline"
          # Push com GITHUB_TOKEN nao dispara o CI; o proximo push humano compara contra este baseline.
          git push
      - name: Remove trigger label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-snapshots"
