name: Update snapshots

# Regenera o baseline de screenshots (oraculo do ADR-0006) no mesmo ambiente do CI
# e commita na branch escolhida. Rodar so quando uma mudanca visual foi aprovada por DDR,
# ou na primeira vez.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots
        env:
          CI: "true"
      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots
          git diff --cached --quiet && { echo "baseline sem mudancas"; exit 0; }
          git commit -m "test(e2e): update screenshot baseline [skip ci]"
          git push
